name: distribev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Execute scripts/configure-docker.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/configure-docker.ps1}
      POSTGRES_DB: ${POSTGRES_DB:?Execute scripts/configure-docker.ps1}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      LOG_LEVEL: info
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Execute scripts/configure-docker.ps1}
      JWT_SECRET: ${JWT_SECRET:?Execute scripts/configure-docker.ps1}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Execute scripts/configure-docker.ps1}
      PRISMA_CONNECT_ON_START: "true"
      CORS_ORIGIN: http://127.0.0.1:5188,http://localhost:5188
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    init: true
    environment:
      VITE_API_URL: /v1
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "127.0.0.1:5188:5188"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5188/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

volumes:
  postgres_data:
    external: true
    name: ${ERP_POSTGRES_VOLUME:?Execute scripts/configure-docker.ps1}
